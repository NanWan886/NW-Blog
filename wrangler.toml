# ============================================================
# wrangler.toml — NW Forum 部署配置
# ============================================================
name = "nw-blog"
main = "src/worker.js"
compatibility_date = "2025-04-01"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "nw-forum"
database_id = "your-database-id-here"

# 环境变量
[vars]
ENVIRONMENT = "production"

# Web Crypto API 需要 experimental
compatibility_flags = [ "nodejs_compat" ]
